name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard self-test
        run: python plugin/tools/guard.py --self-test
      - name: Lint plugin structure
        if: always()
        run: python convert/lint.py
      - name: Converter is up to date with the pinned upstream
        if: runner.os == 'Linux'
        run: |
          python convert/sync.py
          git diff --exit-code -- plugin/scripts plugin/assets plugin/com.github.copilot/agents convert/upstream-snapshot
      - name: MCP server and guard tests
        if: always()
        run: python convert/ci_tests.py plugin/tools/tests
      - name: Script tests
        if: always()
        run: python convert/ci_tests.py plugin/scripts/tests
      - name: Dynamic workflow tests
        if: always()
        run: node convert/ci_node_tests.mjs "plugin/tools/tests/workflows/*.test.mjs"
      - name: Live status canvas tests
        if: always()
        run: node convert/ci_node_tests.mjs "plugin/tools/tests/canvas/*.test.mjs"
      - name: Workflows and the canvas pass the real Copilot SDK's checks
        if: always()
        working-directory: convert
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @github/copilot-sdk@1
          node check_sdk.mjs
