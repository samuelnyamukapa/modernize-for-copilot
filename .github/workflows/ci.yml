name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint plugin structure
        run: python3 convert/lint.py
      - name: Converter is up to date with the pinned upstream
        run: |
          python3 convert/sync.py
          git diff --exit-code -- plugin/scripts plugin/assets plugin/com.github.copilot/agents convert/upstream-snapshot
      - name: Script tests
        run: python3 -m unittest discover -s plugin/scripts/tests
