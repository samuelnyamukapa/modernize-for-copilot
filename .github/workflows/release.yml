name: release

# Run by hand (Actions › release › Run workflow) to tag the version in plugin/plugin.json
# and publish a GitHub Release whose notes are that version's section of CHANGELOG.md.
# To release an earlier commit, give its full SHA as `ref`: the version, notes and tag all
# come from that commit, and the release is not marked Latest. With `ref` empty, the tag goes
# on the head of the branch you run it on, so run it once CI on that commit is green.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA to release (empty: the branch you run this on)"
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read the version and its changelog section
        id: meta
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin/plugin.json'))['version'])")
          case "$version" in *-dev*|"") echo "::error::plugin.json version '$version' is not a release version"; exit 1;; esac
          python3 - "$version" > notes.md <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(version) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## {version}' section")
          print(m.group(1).strip())
          print("\n## Install\n\n```sh\ncopilot plugin marketplace add samuelnyamukapa/modernize-for-copilot\n"
                "copilot plugin install modernize@modernize-for-copilot\n```")
          EOF
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_REF: ${{ inputs.ref }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          target=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          # A tag pushed by hand is fine, as long as it points at the commit being released.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged=$(git rev-list -n 1 "$TAG")
            if [ "$tagged" != "$target" ]; then
              echo "::error::Tag $TAG points at $tagged, not $target"; exit 1
            fi
            echo "Tag $TAG already exists on $target; publishing its release."
          fi
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          if [ -n "$RELEASE_REF" ]; then flags="$flags --latest=false"; fi
          if ! gh release create "$TAG" --target "$target" --title "$TAG" --notes-file notes.md $flags 2>err.txt; then
            cat err.txt
            echo "::error::gh release create failed: $(tr '\n' ' ' < err.txt)"
            # The workflow token may not create a tag on a commit whose workflow files differ from
            # the default branch's. Push that tag yourself, then run this again with the same ref.
            if grep -q "not accessible by integration" err.txt; then
              echo "::error::Push the tag yourself (git tag -a $TAG $target -m $TAG; git push origin $TAG), then run this workflow again with the same ref."
            fi
            exit 1
          fi
